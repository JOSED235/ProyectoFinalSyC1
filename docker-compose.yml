version: "3.8"

services:
  # Broker MQTT local (alternativa o complemento al broker emqx público)
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: iot_mosquitto_broker
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./docker/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - iot_network

  # Base de Datos de Series Temporales
  influxdb:
    image: influxdb:2.7
    container_name: iot_influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=adminpassword123
      - DOCKER_INFLUXDB_INIT_ORG=icesi
      - DOCKER_INFLUXDB_INIT_BUCKET=agricultura-iot
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=HaBwjXKcaJFw2UXP3-ZgJtgzeoNJYPd0o9sMfEFORQshFlbIB54JyxUcVjZZjwhoFyG1OUI6Ws8mD5FIuWizLw==
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    networks:
      - iot_network

  # Gateway IoT / Motor de Reglas y Alertas
  nodered:
    image: nodered/node-red:latest
    container_name: iot_nodered_gateway
    restart: unless-stopped
    ports:
      - "1880:1880"
    environment:
      - TZ=America/Bogota
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto
      - influxdb
    networks:
      - iot_network

  # Simulador de Sensores IoT en segundo plano
  sensor-simulator:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulator
    container_name: iot_sensor_simulator
    restart: unless-stopped
    environment:
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - SIMULATION_INTERVAL=1.0
    depends_on:
      - mosquitto
    networks:
      - iot_network

volumes:
  mosquitto_data:
  mosquitto_log:
  influxdb_data:
  influxdb_config:
  nodered_data:

networks:
  iot_network:
    driver: bridge
